name: LogRite Gatekeeper

permissions:
  pull-requests: write
  contents: read
  issues: write

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  log_coverage-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Gatekeeper Plugin
        run: |
          cd logrite-plugin
          go build -o gatekeeper

      # Exit codes from the plugin: 0 = allow, 1 = block (coverage below threshold, fix PR opened),
      # 2 = no verdict (missing/refused CI key, API unreachable, unreadable reply).
      - name: Run LogRite Gatekeeper
        id: gatekeeper
        env:
          API_URL: ${{ secrets.API_URL }}
          LOGRITE_CI_KEY: ${{ secrets.LOGRITE_API_KEY }}
          LOG_COVERAGE_THRESHOLD: ${{ vars.LOG_COVERAGE_THRESHOLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd logrite-plugin
          ./gatekeeper \
            --branch "${{ github.head_ref }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --commit "${{ github.sha }}" \
            --repoURL "${{ github.server_url }}/${{ github.repository }}/tree/master" | tee gatekeeper.out
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "pr_link=$(grep '^PR_LINK:' gatekeeper.out | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment on PR with fix PR link
        if: steps.gatekeeper.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const prLink = "${{ steps.gatekeeper.outputs.pr_link }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `❌ **LogCoverage check failed**\nAuto-fix PR created: [Click here](${prLink})`
            });

      - name: Fail on coverage block
        if: steps.gatekeeper.outputs.exit_code == '1'
        run: |
          echo "::error title=LogRite coverage::Log coverage is below LOG_COVERAGE_THRESHOLD — see the auto-fix PR."
          exit 1

      - name: Fail when the check produced no verdict
        if: steps.gatekeeper.outputs.exit_code != '0' && steps.gatekeeper.outputs.exit_code != '1'
        run: |
          echo "::error title=LogRite Gatekeeper could not run::No coverage verdict (exit ${{ steps.gatekeeper.outputs.exit_code }}). Check the LOGRITE_API_KEY and API_URL secrets — this is not a logging failure."
          exit 1
